<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xadrez Pro - Carregando...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0e171b; --duo-green:#58CC02; --ink:#FFFFFF; }
  body{ margin:0; height:100vh; background:var(--bg); color:var(--ink); font-family:'Nunito', sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .spinner{ font-size:48px; animation: bounceLogo 2s infinite ease-in-out; margin-bottom:12px; }
  @keyframes bounceLogo { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  h1{ font-family:'Baloo 2', sans-serif; color:var(--duo-green); margin:0; font-size:26px; }
  p{ color:#AFAFAF; font-weight:700; font-size:14px; }
</style>
</head>
<body>
  <div class="spinner">♟️</div>
  <h1>Xadrez Pro</h1>
  <p>Iniciando sistema...</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtXluQl2mtkehl9FICeJBPbP-_A3YRhzk",
  authDomain: "testgyyyy.firebaseapp.com",
  projectId: "testgyyyy",
  storageBucket: "testgyyyy.firebasestorage.app",
  messagingSenderId: "393006784345",
  appId: "1:393006784345:web:df958ca70ac79ccc603648",
  measurementId: "G-5RY35J0MQ6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(console.error);

onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = "menus.html";
  } else {
    window.location.href = "login.html";
  }
});
</script>
</body>
</html>
