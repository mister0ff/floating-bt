<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xadrez Pro - Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --duo-green:#58CC02; --duo-green-dark:#46A302;
    --duo-blue:#1CB0F6; --duo-blue-dark:#1899D6;
    --duo-red:#FF4B4B; --duo-red-dark:#EA2B2B;
    --ink:#FFFFFF; --ink-soft:#AFAFAF;
    --paper:#1f2e35; --paper-card:#13222a; --bg:#0e171b; --border:#2c404c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Nunito', sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:440px; background:var(--paper); padding:24px; border-radius:24px;
    border:2px solid var(--border); box-shadow: 0 8px 0 rgba(0,0,0,0.35); display:flex; flex-direction:column;
  }
  h1{ font-family:'Baloo 2', sans-serif; margin:0 0 6px; color:var(--ink); font-size:28px; text-align:center; }
  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; }
  .logo{ font-size:36px; animation: bounceLogo 2s infinite ease-in-out; }
  @keyframes bounceLogo { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
  .subtitle{ color:var(--ink-soft); font-weight:700; font-size:14px; margin-bottom:16px; text-align:center; }
  input{
    width:100%; padding:13px 14px; margin:8px 0; border-radius:14px;
    border:2px solid var(--border); background:var(--paper-card); color:var(--ink);
    font-family:'Nunito',sans-serif; font-size:16px; font-weight:700; outline:none;
  }
  input:focus{ border-color:var(--duo-blue); box-shadow:0 0 0 3px rgba(28,176,246,0.2); }
  button{
    width:100%; padding:14px; margin:8px 0; border:none; border-radius:16px;
    font-family:'Baloo 2', sans-serif; font-size:16px; font-weight:700;
    color:#fff; cursor:pointer; background:var(--duo-green); box-shadow:0 5px 0 var(--duo-green-dark);
  }
  button:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--duo-green-dark); }
  .btn-blue{ background:var(--duo-blue); box-shadow:0 5px 0 var(--duo-blue-dark); }
  .toggle-mode{ text-align:center; margin-top:12px; font-size:13px; color:var(--duo-blue); font-weight:800; cursor:pointer; }
  p.error{ color:var(--duo-red); font-size:14px; font-weight:700; margin-top:8px; text-align:center; min-height:18px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="card">
  <div class="brand"><span class="logo">♟️</span><h1>Xadrez Pro</h1></div>
  <p class="subtitle" id="form-subtitle">Entre para jogar</p>
  
  <div id="login-form">
    <input type="text" id="login-nick" placeholder="@nick (ex: @usuario)" autocomplete="off">
    <input type="password" id="login-pass" placeholder="Senha">
    <button id="do-login-btn">Entrar</button>
  </div>

  <div id="register-form" class="hidden">
    <input type="text" id="reg-name" placeholder="Nome de Usuário" autocomplete="off">
    <input type="text" id="reg-nick" placeholder="@nick (ex: @usuario)" autocomplete="off">
    <input type="password" id="reg-pass" placeholder="Senha">
    <input type="password" id="reg-repass" placeholder="Repetir Senha">
    <button id="do-register-btn" class="btn-blue">Criar Conta</button>
  </div>

  <div class="toggle-mode" id="toggle-mode-btn">Não tem uma conta? Crie agora</div>
  <p class="error" id="auth-error"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtXluQl2mtkehl9FICeJBPbP-_A3YRhzk",
  authDomain: "testgyyyy.firebaseapp.com",
  projectId: "testgyyyy",
  storageBucket: "testgyyyy.firebasestorage.app",
  messagingSenderId: "393006784345",
  appId: "1:393006784345:web:df958ca70ac79ccc603648",
  measurementId: "G-5RY35J0MQ6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence).catch(console.error);

let isRegisterMode = false;
const toggleBtn = document.getElementById('toggle-mode-btn');
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const subtitle = document.getElementById('form-subtitle');
const authError = document.getElementById('auth-error');

toggleBtn.addEventListener('click', () => {
  isRegisterMode = !isRegisterMode;
  authError.innerText = "";
  if(isRegisterMode){
    loginForm.classList.add('hidden');
    registerForm.classList.remove('hidden');
    subtitle.innerText = "Cadastre seu @nick";
    toggleBtn.innerText = "Já tem uma conta? Entre aqui";
  } else {
    registerForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
    subtitle.innerText = "Entre para jogar";
    toggleBtn.innerText = "Não tem uma conta? Crie agora";
  }
});

function sanitizeNick(nick){
  return nick.trim().toLowerCase().replace('@','');
}

document.getElementById('do-login-btn').addEventListener('click', async () => {
  authError.innerText = "";
  const nick = sanitizeNick(document.getElementById('login-nick').value);
  const pass = document.getElementById('login-pass').value;
  if(!nick || !pass){ authError.innerText = "Preencha todos os campos!"; return; }

  const email = `${nick}@xadrezpro.local`;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = "menus.html";
  } catch(err){
    authError.innerText = "Erro ao entrar: " + err.message;
  }
});

document.getElementById('do-register-btn').addEventListener('click', async () => {
  authError.innerText = "";
  const name = document.getElementById('reg-name').value.trim();
  const nick = sanitizeNick(document.getElementById('reg-nick').value);
  const pass = document.getElementById('reg-pass').value;
  const repass = document.getElementById('reg-repass').value;

  if(!name || !nick || !pass || !repass){ authError.innerText = "Preencha todos os campos!"; return; }
  if(pass !== repass){ authError.innerText = "As senhas não coincidem!"; return; }
  if(pass.length < 6){ authError.innerText = "A senha deve ter pelo menos 6 caracteres!"; return; }

  const email = `${nick}@xadrezpro.local`;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const isDono = nick === 'dono' || name.toUpperCase() === 'DONO';
    await setDoc(doc(db, 'users', cred.user.uid), {
      displayName: name,
      nick: '@' + nick,
      wins: isDono ? 999 : 0,
      losses: 0,
      draws: 0,
      points: 500,
      insignia: isDono ? 10 : 1,
      role: isDono ? 'admin' : 'user',
      isVip: isDono,
      isElite: isDono,
      followers: [],
      following: [],
      avatar: '',
      createdAt: Date.now()
    });
    window.location.href = "menus.html";
  } catch(err){
    authError.innerText = "Erro no cadastro: " + err.message;
  }
});
</script>
</body>
</html>
