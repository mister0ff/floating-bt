<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Studio Pro X</title>
  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #121216;
      --bg-card: #18181c;
      --border-color: #27272a;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.25);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
    }

    /* Cabeçalho Redesenhado */
    .app-header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .app-title {
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .res-group {
      display: flex;
      align-items: center;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2px 6px;
      gap: 4px;
    }

    .res-select, .res-input {
      background: transparent;
      color: var(--text-main);
      border: none;
      font-size: 11px;
      outline: none;
      font-weight: 600;
      padding: 4px;
    }

    .res-input {
      width: 38px;
      text-align: center;
    }

    .res-input::-webkit-inner-spin-button, 
    .res-input::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }

    /* Área Central - Canvas */
    .canvas-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 6px 0;
    }

    .canvas-container {
      position: relative;
      width: min(calc(100vw - 20px), calc(100vh - 240px));
      height: min(calc(100vw - 20px), calc(100vh - 240px));
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      touch-action: none;
      background-color: #ffffff;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #previewCanvas, #gridOverlay {
      pointer-events: none;
    }

    /* Sub-Toolbar & Modificadores */
    .sub-toolbar {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0;
      padding: 4px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .brush-slider-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 8px;
      height: 34px;
    }

    .brush-slider-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 40px;
    }

    .brush-slider {
      width: 65px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .icon-btn {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      height: 34px;
      padding: 0 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .icon-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    .icon-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Paleta de Cores Recentes */
    .palette-section {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 4px;
      background: var(--bg-surface);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .palette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .palette-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .palette-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
    }

    .palette-container::-webkit-scrollbar { display: none; }

    .color-swatch {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-swatch.active {
      transform: scale(1.18);
      border-color: #ffffff;
      box-shadow: 0 0 0 2px var(--accent);
    }

    .color-picker-trigger {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      cursor: pointer;
      border: 2px solid var(--border-color);
      transition: transform 0.15s;
    }

    .color-picker-trigger:hover { transform: scale(1.08); }

    /* Barra Principal de Ferramentas */
    .main-toolbar-wrapper {
      position: relative;
      width: 100%;
      max-width: 680px;
    }

    .main-toolbar {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      background-color: var(--bg-surface);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .tool-btn {
      background-color: var(--bg-base);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      padding: 0 1px;
    }

    .tool-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .tool-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background-color: var(--accent-glow);
    }

    /* Extensão de Formas */
    .shapes-extension {
      display: none;
      width: 100%;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background-color: var(--bg-surface);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      margin-bottom: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .shapes-extension.show {
      display: grid;
    }

    svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Modais Estilizados */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    @media (min-width: 480px) {
      .modal-overlay { align-items: center; }
    }

    .modal-content {
      width: 100%;
      max-width: 520px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 85vh;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-close {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .layer-actions-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary {
      background-color: var(--bg-base);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 55vh;
      padding-right: 4px;
    }

    .layer-item {
      background-color: var(--bg-base);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .layer-item.active {
      border-color: var(--accent);
      background-color: rgba(244, 63, 94, 0.08);
    }

    .layer-item.dragging { opacity: 0.4; }

    .layer-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .layer-drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-size: 16px;
    }

    .layer-thumb {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-image: linear-gradient(45deg, #27272a 25%, transparent 25%),
                        linear-gradient(-45deg, #27272a 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #27272a 75%),
                        linear-gradient(-45deg, transparent 75%, #27272a 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
      background-color: #18181b;
      image-rendering: pixelated;
    }

    .layer-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .layer-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .layer-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .layer-btn:hover { color: var(--text-main); border-color: var(--text-muted); }

    /* Picker Modal */
    .hex-input {
      width: 100%;
      background-color: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      font-family: monospace;
    }

    .picker-box-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      touch-action: none;
      border: 1px solid var(--border-color);
    }

    #satValCanvas { width: 100%; height: 100%; display: block; }

    .sat-val-handle {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hue-slider-container {
      position: relative;
      width: 100%;
      height: 28px;
      border-radius: 14px;
      touch-action: none;
      border: 1px solid var(--border-color);
    }

    #hueCanvas { width: 100%; height: 100%; border-radius: 14px; display: block; }

    .hue-handle {
      position: absolute;
      top: 50%;
      width: 22px;
      height: 32px;
      border: 3px solid #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho Principal -->
  <div class="app-header">
    <span class="app-title">Pixel Studio Pro X</span>
    
    <div class="header-actions">
      <!-- Resolução customizável e seletor otimizados -->
      <div class="res-group" title="Resolução do Canvas">
        <select id="resSelect" class="res-select">
          <option value="8">8x8</option>
          <option value="16" selected>16x16</option>
          <option value="32">32x32</option>
          <option value="64">64x64</option>
          <option value="128">128x128</option>
          <option value="custom">Custom</option>
        </select>
        <input type="number" id="customResInput" class="res-input" value="16" min="4" max="512" title="Digite a resolução desejada">
      </div>

      <label class="icon-btn" title="Upar Imagem">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <input type="file" id="fileInputHeader" accept="image/*" style="display: none;">
      </label>

      <button class="icon-btn" id="btnExport" title="Salvar PNG">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>

      <button class="icon-btn" id="btnLayersMenu" title="Menu de Camadas">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Container do Canvas -->
  <div class="canvas-wrapper">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="bgCanvas" width="16" height="16"></canvas>
      <canvas id="pixelCanvas" width="16" height="16"></canvas>
      <canvas id="previewCanvas" width="16" height="16"></canvas>
      <canvas id="gridOverlay" width="16" height="16"></canvas>
    </div>
  </div>

  <!-- Modificadores e Controles -->
  <div class="sub-toolbar">
    <div class="btn-group">
      <button class="icon-btn active" id="btnGrid" title="Alternar Grade">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/></svg>
      </button>

      <div class="brush-slider-container">
        <span class="brush-slider-label" id="brushSizeLabel">Tam: 1px</span>
        <input type="range" id="brushSlider" class="brush-slider" min="1" max="8" value="1" step="1">
      </div>

      <button class="icon-btn" id="btnGradientToggle" title="Modos de Degradê">
        <svg viewBox="0 0 24 24"><path d="M11 9h2v2h-2zm-2 2h2v2H9zm4 0h2v2H-2zm2-2h2v2h-2zm0-2h2v2h-2zM7 13h2v2H7zm4 2h2v2H9zm4 0h2v2H-2zm-2 2h2v2H-2zm-4 0h2v2H7zM3 3v18h18V3H3zm16 16H5V5h14v14z"/></svg>
        <span id="labelGradient">Degradê: OFF</span>
      </button>

      <button class="icon-btn active" id="btnFillToggle" title="Miolo Preenchido">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span id="labelFill">Miolo: SIM</span>
      </button>
    </div>

    <div class="btn-group">
      <button class="icon-btn" id="btnUndo" title="Desfazer" disabled>
        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      </button>
      <button class="icon-btn" id="btnRedo" title="Refazer" disabled>
        <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.96 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
      </button>
    </div>
  </div>

  <!-- Paleta de Cores Recentes -->
  <div class="palette-section">
    <div class="palette-header">
      <span class="palette-title">Cores Recentes</span>
    </div>

    <div class="palette-container">
      <div class="color-picker-trigger" id="openColorModalBtn" title="Cor Customizada"></div>
      <div id="paletteSwatches" style="display: flex; gap: 6px;"></div>
    </div>
  </div>

  <!-- Barra Principal de Ferramentas & Extensão de Formas -->
  <div class="main-toolbar-wrapper">
    <!-- Extensão de Formas -->
    <div class="shapes-extension" id="shapesExtension">
      <button class="tool-btn shape-popup-btn" data-shape="rect" title="Quadro">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM5 19V5h14v14H5z"/></svg>
        Quadro
      </button>
      <button class="tool-btn shape-popup-btn" data-shape="circle" title="Círculo/Oval Flexível">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
        Círculo
      </button>
      <button class="tool-btn shape-popup-btn" data-shape="line" title="Reta">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 5 17.59 6.41 19 19 6.41z"/></svg>
        Reta
      </button>
      <button class="tool-btn shape-popup-btn" data-shape="triangle" title="Triângulo">
        <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.83L19.53 19H4.47L12 5.83z"/></svg>
        Triângulo
      </button>
    </div>

    <div class="main-toolbar">
      <button class="tool-btn active" id="toolPencil" title="Pincel">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        Pincel
      </button>

      <button class="tool-btn" id="toolBucket" title="Balde de Tinta">
        <svg viewBox="0 0 24 24"><path d="M19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5zM16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L9 6.21 12.79 10H5.21z"/></svg>
        Balde
      </button>

      <button class="tool-btn" id="btnEyedropper" title="Conta-gotas">

  <!-- Modal de Camadas -->
  <div class="modal-overlay" id="layersModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Painel de Camadas</span>
        <button class="btn-close" id="btnCloseLayers">Fechar</button>
      </div>

      <div class="layer-actions-top">
        <button class="btn-primary" id="btnAddLayer">+ Nova Camada</button>
        <label class="btn-secondary" title="Upar Imagem para a Camada">
          📁 Upar Imagem
          <input type="file" id="fileInputLayer" accept="image/*" style="display: none;">

  <!-- Modal de Cor Customizada -->
  <div class="modal-overlay" id="colorModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Escolher Cor</span>
        <button class="btn-close" id="btnSelectColor">Pronto</button>
      </div>

      <input type="text" class="hex-input" id="hexInput" value="#000000" maxlength="7">

      <div class="picker-box-container" id="satValBox">
        <canvas id="satValCanvas" width="256" height="256"></canvas>
        <div class="sat-val-handle" id="satValHandle"></div>
      </div>

      <div class="hue-slider-container" id="hueBar">
        <canvas id="hueCanvas" width="360" height="26"></canvas>
        <div class="hue-handle" id="hueHandle"></div>
      </div>
    </div>
  </div>

  <script>
    let GRID_SIZE = 16;
    
    let recentColors = [
      '#f43f5e', '#ef4444', '#dc2626', '#b91c1c', '#f87171', '#fb7185', '#ff5555', '#ff0000'
    ];

    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');

    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    
    const gridOverlay = document.getElementById('gridOverlay');
    const gridCtx = gridOverlay.getContext('2d');
    
    const container = document.getElementById('canvasContainer');

    let currentColor = '#f43f5e';
    let currentTool = 'pencil';
    let isDrawing = false;
    let showGrid = true;
    let fillShape = true;

    let gradientMode = 'off'; 
    let eraserMode = 'normal';
    let brushSize = 1;

    let dragStart = null;
    let moveSnapshotCanvas = null;

    let layers = [];
    let activeLayerIndex = 0;
    let layerCounter = 1;

    let historyStack = [];
    let historyIndex = -1;

    let pickerHue = 0, pickerSat = 100, pickerVal = 100;

    function init() {
      setupUI();
      setupModalColorPicker();
      setupLayerEvents();
      updateCanvasResolution(GRID_SIZE, false);
      renderRecentColors();
    }

    function renderRecentColors() {
      const swatchesContainer = document.getElementById('paletteSwatches');
      swatchesContainer.innerHTML = '';
      
      recentColors.forEach(color => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = color;
        swatch.dataset.color = color;
        if (color.toLowerCase() === currentColor.toLowerCase()) swatch.classList.add('active');
        swatch.onclick = () => setColor(color);
        swatchesContainer.appendChild(swatch);
      });
    }

    function addRecentColor(color) {
      const norm = color.toLowerCase();
      recentColors = recentColors.filter(c => c.toLowerCase() !== norm);
      recentColors.unshift(color);
      if (recentColors.length > 25) recentColors.pop();
      renderRecentColors();
    }

    function formatLayerName(num) {
      return `Camada #${String(num).padStart(2, '0')}`;
    }

    function createLayerObject(customName) {
      const lCanvas = document.createElement('canvas');
      lCanvas.width = GRID_SIZE;
      lCanvas.height = GRID_SIZE;
      const lCtx = lCanvas.getContext('2d', { willReadFrequently: true });
      lCtx.imageSmoothingEnabled = false;

      return {
        id: 'layer_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: customName || formatLayerName(layerCounter++),
        canvas: lCanvas,
        ctx: lCtx,
        visible: true
      };
    }

    function getActiveLayer() {
      if (layers.length === 0) return null;
      if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
      return layers[activeLayerIndex];
    }

    function renderLayers() {
      ctx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
      ctx.imageSmoothingEnabled = false;
      layers.forEach(layer => {
        if (layer.visible) {
          ctx.drawImage(layer.canvas, 0, 0);
        }
      });
    }

    // Função de redimensionamento que preserva as camadas e imagens existentes (Não apaga ao mudar resolução)
    function updateCanvasResolution(newSize, saveHistory = true) {
      newSize = parseInt(newSize);
      if (isNaN(newSize) || newSize < 4 || newSize > 512) return;
      
      const oldSize = GRID_SIZE;
      GRID_SIZE = newSize;

      [bgCanvas, canvas, previewCanvas, gridOverlay].forEach(c => {
        c.width = GRID_SIZE;
        c.height = GRID_SIZE;
        const cCtx = c.getContext('2d');
        if (cCtx) cCtx.imageSmoothingEnabled = false;
      });

      drawCheckerboard();
      drawGrid();

      if (layers.length === 0) {
        layers.push(createLayerObject());
        activeLayerIndex = 0;
      } else {
        // Redimensiona o conteúdo das camadas existentes proporcionalmente sem perder a imagem
        layers.forEach(layer => {
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = oldSize;
          tempCanvas.height = oldSize;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.imageSmoothingEnabled = false;
          tempCtx.drawImage(layer.canvas, 0, 0);

          layer.canvas.width = GRID_SIZE;
          layer.canvas.height = GRID_SIZE;
          layer.ctx = layer.canvas.getContext('2d', { willReadFrequently: true });
          layer.ctx.imageSmoothingEnabled = false;
          layer.ctx.drawImage(tempCanvas, 0, 0, oldSize, oldSize, 0, 0, GRID_SIZE, GRID_SIZE);
        });
      }

      renderLayers();
      renderLayerList();
      if (saveHistory) saveState();
    }

    function flipLayerHorizontal(index) {
      const layer = layers[index];
      if (!layer) return;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = GRID_SIZE;
      tempCanvas.height = GRID_SIZE;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.imageSmoothingEnabled = false;
      tempCtx.drawImage(layer.canvas, 0, 0);

      layer.ctx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
      layer.ctx.save();
      layer.ctx.translate(GRID_SIZE, 0);
      layer.ctx.scale(-1, 1);
      layer.ctx.drawImage(tempCanvas, 0, 0);
      layer.ctx.restore();

      renderLayers();
      renderLayerList();
      saveState();
    }

    function rotateLayer(index) {
      const layer = layers[index];
      if (!layer) return;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = GRID_SIZE;
      tempCanvas.height = GRID_SIZE;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.imageSmoothingEnabled = false;
      tempCtx.drawImage(layer.canvas, 0, 0);

      layer.ctx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
      layer.ctx.save();
      layer.ctx.translate(GRID_SIZE / 2, GRID_SIZE / 2);
      layer.ctx.rotate((90 * Math.PI) / 180);
      layer.ctx.drawImage(tempCanvas, -GRID_SIZE / 2, -GRID_SIZE / 2);
      layer.ctx.restore();

      renderLayers();
      renderLayerList();
      saveState();
    }

    function renderLayerList() {
      const listContainer = document.getElementById('layerList');
      listContainer.innerHTML = '';

      for (let i = layers.length - 1; i >= 0; i--) {
        const layer = layers[i];
        const item = document.createElement('div');
        item.className = `layer-item ${i === activeLayerIndex ? 'active' : ''}`;
        item.draggable = true;
        item.dataset.index = i;

        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.className = 'layer-thumb';
        thumbCanvas.width = 40;
        thumbCanvas.height = 40;
        const tCtx = thumbCanvas.getContext('2d');
        tCtx.imageSmoothingEnabled = false;
        tCtx.drawImage(layer.canvas, 0, 0, 40, 40);

        item.innerHTML = `
          <div class="layer-left">
            <span class="layer-drag-handle" title="Arraste para reordenar">☰</span>
            <button class="layer-btn btn-vis" title="Visibilidade">
              ${layer.visible ? 
                '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>' : 
                '<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/></svg>'
              }
            </button>
            <div class="thumb-holder"></div>
            <span class="layer-name">${layer.name}</span>
          </div>

          <div class="layer-controls">
            <button class="layer-btn btn-flip" title="Espelhar">↔</button>
            <button class="layer-btn btn-rotate" title="Girar">↻</button>
            <button class="layer-btn btn-up" title="Subir">▲</button>
            <button class="layer-btn btn-down" title="Descer">▼</button>
            <button class="layer-btn btn-clone" title="Duplicar">📋</button>
            <button class="layer-btn btn-merge" title="Unir Abaixo" ${i === 0 ? 'disabled style="opacity:0.3;"' : ''}>🔗</button>
            <button class="layer-btn btn-delete" title="Excluir" ${layers.length <= 1 ? 'disabled style="opacity:0.3;"' : ''}>🗑️</button>
          </div>
        `;

        item.querySelector('.thumb-holder').appendChild(thumbCanvas);

        item.onclick = (e) => {
          if (e.target.closest('.layer-btn')) return;
          activeLayerIndex = i;
          renderLayerList();
        };

        item.querySelector('.btn-vis').onclick = (e) => {
          e.stopPropagation();
          layer.visible = !layer.visible;
          renderLayers();
          renderLayerList();
        };

        item.querySelector('.btn-flip').onclick = (e) => {
          e.stopPropagation();
          flipLayerHorizontal(i);
        };

        item.querySelector('.btn-rotate').onclick = (e) => {
          e.stopPropagation();
          rotateLayer(i);
        };

        item.querySelector('.btn-up').onclick = (e) => {
          e.stopPropagation();
          if (i < layers.length - 1) swapLayers(i, i + 1);
        };

        item.querySelector('.btn-down').onclick = (e) => {
          e.stopPropagation();
          if (i > 0) swapLayers(i, i - 1);
        };

        item.querySelector('.btn-clone').onclick = (e) => {
          e.stopPropagation();
          cloneLayer(i);
        };

        item.querySelector('.btn-merge').onclick = (e) => {
          e.stopPropagation();
          mergeDownLayer(i);
        };

        item.querySelector('.btn-delete').onclick = (e) => {
          e.stopPropagation();
          deleteLayer(i);
        };

        item.ondragstart = (e) => {
          e.dataTransfer.setData('text/plain', i);
          item.classList.add('dragging');
        };

        item.ondragend = () => item.classList.remove('dragging');
        item.ondragover = (e) => e.preventDefault();

        item.ondrop = (e) => {
          e.preventDefault();
          const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
          const toIndex = i;
          if (fromIndex !== toIndex) {
            const moved = layers.splice(fromIndex, 1)[0];
            layers.splice(toIndex, 0, moved);
            activeLayerIndex = toIndex;
            renderLayers();
            renderLayerList();
            saveState();
          }
        };

        listContainer.appendChild(item);
      }
    }

    function swapLayers(i, j) {
      const temp = layers[i];
      layers[i] = layers[j];
      layers[j] = temp;
      if (activeLayerIndex === i) activeLayerIndex = j;
      else if (activeLayerIndex === j) activeLayerIndex = i;
      renderLayers();
      renderLayerList();
      saveState();
    }

    function cloneLayer(index) {
      const src = layers[index];
      const newLayer = createLayerObject(`${src.name} (Cópia)`);
      newLayer.ctx.drawImage(src.canvas, 0, 0);
      layers.splice(index + 1, 0, newLayer);
      activeLayerIndex = index + 1;
      renderLayers();
      renderLayerList();
      saveState();
    }

    function mergeDownLayer(index) {
      if (index <= 0) return;
      const top = layers[index];
      const bottom = layers[index - 1];
      bottom.ctx.drawImage(top.canvas, 0, 0);
      layers.splice(index, 1);
      activeLayerIndex = index - 1;
      renderLayers();
      renderLayerList();
      saveState();
    }

    function deleteLayer(index) {
      if (layers.length <= 1) return;
      layers.splice(index, 1);
      if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
      renderLayers();
      renderLayerList();
      saveState();
    }

    // Ao upar imagem, ajusta automaticamente a resolução para ser a mesma da imagem!
    function loadFileIntoActiveLayer(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const imgMaxDim = Math.max(img.width, img.height);
          const targetRes = Math.min(Math.max(imgMaxDim, 8), 256); // Limite ideal para performance pixel art

          GRID_SIZE = targetRes;
          document.getElementById('customResInput').value = GRID_SIZE;
          document.getElementById('resSelect').value = 'custom';

          [bgCanvas, canvas, previewCanvas, gridOverlay].forEach(c => {
            c.width = GRID_SIZE;
            c.height = GRID_SIZE;
            const cCtx = c.getContext('2d');
            if (cCtx) cCtx.imageSmoothingEnabled = false;
          });

          drawCheckerboard();
          drawGrid();

          layers = [];
          layerCounter = 1;
          const newLayer = createLayerObject();
          layers.push(newLayer);
          activeLayerIndex = 0;

          newLayer.ctx.imageSmoothingEnabled = false;
          let dw = GRID_SIZE, dh = GRID_SIZE;
          let dx = 0, dy = 0;
          const aspect = img.width / img.height;

          if (aspect > 1) {
            dh = Math.round(GRID_SIZE / aspect);
            dy = Math.floor((GRID_SIZE - dh) / 2);
          } else if (aspect < 1) {
            dw = Math.round(GRID_SIZE * aspect);
            dx = Math.floor((GRID_SIZE - dw) / 2);
          }

          newLayer.ctx.drawImage(img, dx, dy, dw, dh);
          renderLayers();
          renderLayerList();
          saveState();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setupLayerEvents() {
      document.getElementById('btnLayersMenu').onclick = () => {
        renderLayerList();
        document.getElementById('layersModal').style.display = 'flex';
      };

      document.getElementById('btnCloseLayers').onclick = () => {
        document.getElementById('layersModal').style.display = 'none';
      };

      document.getElementById('btnAddLayer').onclick = () => {
        const newLayer = createLayerObject();
        layers.push(newLayer);
        activeLayerIndex = layers.length - 1;
        renderLayers();
        renderLayerList();
        saveState();
      };

      document.getElementById('fileInputLayer').onchange = (e) => {
        loadFileIntoActiveLayer(e.target.files[0]);
        e.target.value = '';
      };
    }

    function saveState() {
      historyStack.splice(historyIndex + 1);

      const layersCopy = layers.map(l => {
        const c = document.createElement('canvas');
        c.width = GRID_SIZE;
        c.height = GRID_SIZE;
        const cCtx = c.getContext('2d');
        cCtx.imageSmoothingEnabled = false;
        cCtx.drawImage(l.canvas, 0, 0);
        return {
          id: l.id,
          name: l.name,
          visible: l.visible,
          canvas: c
        };
      });

      historyStack.push({
        activeLayerIndex: activeLayerIndex,
        layers: layersCopy
      });

      historyIndex++;
      updateHistoryButtons();
    }

    function restoreState(snapshot) {
      activeLayerIndex = snapshot.activeLayerIndex;
      layers = snapshot.layers.map(l => {
        const lCanvas = document.createElement('canvas');
        lCanvas.width = GRID_SIZE;
        lCanvas.height = GRID_SIZE;
        const lCtx = lCanvas.getContext('2d', { willReadFrequently: true });
        lCtx.imageSmoothingEnabled = false;
        lCtx.drawImage(l.canvas, 0, 0);
        return {
          id: l.id,
          name: l.name,
          visible: l.visible,
          canvas: lCanvas,
          ctx: lCtx
        };
      });

      renderLayers();
      renderLayerList();
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        restoreState(historyStack[historyIndex]);
        updateHistoryButtons();
      }
    }

    function redo() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        restoreState(historyStack[historyIndex]);
        updateHistoryButtons();
      }
    }

    function updateHistoryButtons() {
      document.getElementById('btnUndo').disabled = historyIndex <= 0;
      document.getElementById('btnRedo').disabled = historyIndex >= historyStack.length - 1;
    }

    // Grid de Tabuleiro adaptável à resolução
    function drawCheckerboard() {
      bgCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
      const step = Math.max(1, Math.floor(GRID_SIZE / 16));
      for (let y = 0; y < GRID_SIZE; y += step) {
        for (let x = 0; x < GRID_SIZE; x += step) {
          bgCtx.fillStyle = ((x / step) + (y / step)) % 2 === 0 ? '#ffffff' : '#e4e4e7';
          bgCtx.fillRect(x, y, step, step);
        }
      }
    }

    function drawGrid() {
      gridCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
      if (!showGrid || GRID_SIZE > 128) return;
      gridCtx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
      gridCtx.lineWidth = 0.05;
      gridCtx.beginPath();
      for (let i = 0; i <= GRID_SIZE; i++) {
        gridCtx.moveTo(i, 0); gridCtx.lineTo(i, GRID_SIZE);
        gridCtx.moveTo(0, i); gridCtx.lineTo(GRID_SIZE, i);
      }
      gridCtx.stroke();
    }

    function getGridCoords(e) {
      const rect = container.getBoundingClientRect();
      const x = Math.floor(((e.clientX - rect.left) / rect.width) * GRID_SIZE);
      const y = Math.floor(((e.clientY - rect.top) / rect.height) * GRID_SIZE);
      return {
        x: Math.max(0, Math.min(GRID_SIZE - 1, x)),
        y: Math.max(0, Math.min(GRID_SIZE - 1, y))
      };
    }

    function getGradientPixelColor(x, y, p0, p1, baseColor) {
      if (gradientMode === 'off') return baseColor;

      const c1 = hexToRgba(baseColor);
      const c2 = [Math.round(c1[0] * 0.2), Math.round(c1[1] * 0.2), Math.round(c1[2] * 0.2), 255];

      if (gradientMode === 'linear') {
        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;
        const distSq = dx * dx + dy * dy || 1;
        let t = ((x - p0.x) * dx + (y - p0.y) * dy) / distSq;
        t = Math.max(0, Math.min(1, t));

        const r = Math.round(c1[0] + t * (c2[0] - c1[0]));
        const g = Math.round(c1[1] + t * (c2[1] - c1[1]));
        const b = Math.round(c1[2] + t * (c2[2] - c1[2]));
        return `rgb(${r},${g},${b})`;
      } else if (gradientMode === 'border') {
        const cx = (p0.x + p1.x) / 2;
        const cy = (p0.y + p1.y) / 2;
        const maxR = Math.hypot(p1.x - p0.x, p1.y - p0.y) / 2 || (GRID_SIZE / 2);
        const dist = Math.hypot(x - cx, y - cy);
        let t = dist / maxR;
        t = Math.max(0, Math.min(1, t));

        const r = Math.round(c1[0] + t * (c2[0] - c1[0]));
        const g = Math.round(c1[1] + t * (c2[1] - c1[1]));
        const b = Math.round(c1[2] + t * (c2[2] - c1[2]));
        return `rgb(${r},${g},${b})`;
      }
      return baseColor;
    }

    function applyBrush(layerCtx, x, y, isEraser = false, color = currentColor, p0 = null, p1 = null) {
      const offset = Math.floor((brushSize - 1) / 2);
      const startX = Math.max(0, x - offset);
      const startY = Math.max(0, y - offset);
      const endX = Math.min(GRID_SIZE - 1, startX + brushSize - 1);
      const endY = Math.min(GRID_SIZE - 1, startY + brushSize - 1);

      for (let bx = startX; bx <= endX; bx++) {
        for (let by = startY; by <= endY; by++) {
          if (isEraser) {
            layerCtx.clearRect(bx, by, 1, 1);
          } else {
            layerCtx.fillStyle = getGradientPixelColor(bx, by, p0 || {x, y}, p1 || {x, y}, color);
            layerCtx.fillRect(bx, by, 1, 1);
          }
        }
      }
    }

    function handlePointerDown(e) {
      isDrawing = true;
      const coords = getGridCoords(e);
      dragStart = coords;

      const layer = getActiveLayer();
      if (!layer || !layer.visible) return;

      if (currentTool === 'eyedropper') {
        pickColor(coords.x, coords.y);
        setTool('pencil');
        isDrawing = false;
        return;
      }

      if (currentTool === 'bucket') {
        floodFill(layer.ctx, coords.x, coords.y, currentColor);
        renderLayers();
        renderLayerList();
        saveState();
        isDrawing = false;
        return;
      }

      if (currentTool === 'eraser' && eraserMode === 'bucket') {
        floodClear(layer.ctx, coords.x, coords.y);
        renderLayers();
        renderLayerList();
        saveState();
        isDrawing = false;
        return;
      }

      if (currentTool === 'move') {
        moveSnapshotCanvas = document.createElement('canvas');
        moveSnapshotCanvas.width = GRID_SIZE;
        moveSnapshotCanvas.height = GRID_SIZE;
        const mCtx = moveSnapshotCanvas.getContext('2d');
        mCtx.imageSmoothingEnabled = false;
        mCtx.drawImage(layer.canvas, 0, 0);
        return;
      }

      if (currentTool === 'pencil') {
        applyBrush(layer.ctx, coords.x, coords.y, false, currentColor, dragStart, coords);
        renderLayers();
      } else if (currentTool === 'eraser') {
        applyBrush(layer.ctx, coords.x, coords.y, true);
        renderLayers();
      }
    }

    function handlePointerMove(e) {
      if (!isDrawing) return;
      const coords = getGridCoords(e);
      const layer = getActiveLayer();
      if (!layer || !layer.visible) return;

      if (currentTool === 'move') {
        const dx = coords.x - dragStart.x;
        const dy = coords.y - dragStart.y;
        layer.ctx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
        layer.ctx.drawImage(moveSnapshotCanvas, dx, dy);
        renderLayers();
      } else if (currentTool === 'pencil') {
        applyBrush(layer.ctx, coords.x, coords.y, false, currentColor, dragStart, coords);
        renderLayers();
      } else if (currentTool === 'eraser' && eraserMode === 'normal') {
        applyBrush(layer.ctx, coords.x, coords.y, true);
        renderLayers();
      } else if (['line', 'rect', 'circle', 'triangle'].includes(currentTool)) {
        previewCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
        drawShape(previewCtx, currentTool, dragStart, coords, currentColor, fillShape);
      }
    }

    function handlePointerUp(e) {
      if (!isDrawing) return;
      isDrawing = false;
      const coords = getGridCoords(e);
      const layer = getActiveLayer();

      if (currentTool === 'move') {
        moveSnapshotCanvas = null;
        renderLayerList();
        saveState();
      } else if (['line', 'rect', 'circle', 'triangle'].includes(currentTool) && layer) {
        previewCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
        drawShape(layer.ctx, currentTool, dragStart, coords, currentColor, fillShape);
        renderLayers();
        renderLayerList();
        saveState();
      } else if (currentTool === 'pencil' || currentTool === 'eraser') {
        renderLayerList();
        saveState();
      }
    }

    function pointInTriangle(px, py, x1, y1, x2, y2, x3, y3) {
      const denom = (y2 - y3)*(x1 - x3) + (x3 - x2)*(y1 - y3);
      if (denom === 0) return false;
      const a = ((y2 - y3)*(px - x3) + (x3 - x2)*(py - y3)) / denom;
      const b = ((y3 - y1)*(px - x3) + (x1 - x3)*(py - y3)) / denom;
      const c = 1 - a - b;
      return a >= 0 && a <= 1 && b >= 0 && b <= 1 && c >= 0 && c <= 1;
    }

    function drawShape(targetCtx, tool, p0, p1, color, filled) {
      if (tool === 'line') {
        const points = getLinePoints(p0.x, p0.y, p1.x, p1.y);
        points.forEach(pt => {
          applyBrush(targetCtx, pt.x, pt.y, false, color, p0, p1);
        });
      } else if (tool === 'rect') {
        const minX = Math.min(p0.x, p1.x), maxX = Math.max(p0.x, p1.x);
        const minY = Math.min(p0.y, p1.y), maxY = Math.max(p0.y, p1.y);
        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            if (filled || x === minX || x === maxX || y === minY || y === maxY) {
              applyBrush(targetCtx, x, y, false, color, p0, p1);
            }
          }
        }
      } else if (tool === 'circle') {
        // Círculo flexível / oval ajustado para não ser 100% rígido e travado matematicamente
        const cx = (p0.x + p1.x) / 2, cy = (p0.y + p1.y) / 2;
        const rx = Math.max(1, Math.abs(p1.x - p0.x) / 2);
        const ry = Math.max(1, Math.abs(p1.y - p0.y) / 2);
        const minX = Math.min(p0.x, p1.x), maxX = Math.max(p0.x, p1.x);
        const minY = Math.min(p0.y, p1.y), maxY = Math.max(p0.y, p1.y);

        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            const dx = (x - cx), dy = (y - cy);
            const val = ((dx * dx) / (rx * rx)) + ((dy * dy) / (ry * ry));
            if (filled ? (val <= 1.15) : (val >= 0.65 && val <= 1.35)) {
              applyBrush(targetCtx, x, y, false, color, p0, p1);
            }
          }
        }
      } else if (tool === 'triangle') {
        const minX = Math.min(p0.x, p1.x), maxX = Math.max(p0.x, p1.x);
        const minY = Math.min(p0.y, p1.y), maxY = Math.max(p0.y, p1.y);
        const x1 = Math.floor((minX + maxX) / 2), y1 = minY;
        const x2 = minX, y2 = maxY;
        const x3 = maxX, y3 = maxY;

        if (filled) {
          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) {
              if (pointInTriangle(x, y, x1, y1, x2, y2, x3, y3)) {
                applyBrush(targetCtx, x, y, false, color, p0, p1);
              }
            }
          }
        } else {
          const pts1 = getLinePoints(x1, y1, x2, y2);
          const pts2 = getLinePoints(x2, y2, x3, y3);
          const pts3 = getLinePoints(x3, y3, x1, y1);
          [...pts1, ...pts2, ...pts3].forEach(pt => {
            applyBrush(targetCtx, pt.x, pt.y, false, color, p0, p1);
          });
        }
      }
    }

    function getLinePoints(x0, y0, x1, y1) {
      const points = [];
      let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
      let sx = (x0 < x1) ? 1 : -1, sy = (y0 < y1) ? 1 : -1;
      let err = dx - dy;
      while (true) {
        points.push({ x: x0, y: y0 });
        if (x0 === x1 && y0 === y1) break;
        let e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
      }
      return points;
    }

    function floodFill(targetCtx, startX, startY, hexColor) {
      const imgData = targetCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE);
      const data = imgData.data;

      const targetColor = getPixelRGBA(data, startX, startY);
      const fillRGBA = hexToRgba(hexColor);
      if (colorsMatch(targetColor, fillRGBA)) return;

      const queue = [[startX, startY]];
      const visited = new Uint8Array(GRID_SIZE * GRID_SIZE);

      while (queue.length > 0) {
        const [x, y] = queue.pop();
        const idx = y * GRID_SIZE + x;

        if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) continue;
        if (visited[idx]) continue;
        visited[idx] = 1;

        if (colorsMatch(getPixelRGBA(data, x, y), targetColor)) {
          setPixelRGBA(data, x, y, fillRGBA);
          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      targetCtx.putImageData(imgData, 0, 0);
    }

    function floodClear(targetCtx, startX, startY) {
      const imgData = targetCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE);
      const data = imgData.data;

      const targetColor = getPixelRGBA(data, startX, startY);
      if (targetColor[3] === 0) return;

      const clearRGBA = [0, 0, 0, 0];
      const queue = [[startX, startY]];
      const visited = new Uint8Array(GRID_SIZE * GRID_SIZE);

      while (queue.length > 0) {
        const [x, y] = queue.pop();
        const idx = y * GRID_SIZE + x;

        if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) continue;
        if (visited[idx]) continue;
        visited[idx] = 1;

        if (colorsMatch(getPixelRGBA(data, x, y), targetColor)) {
          setPixelRGBA(data, x, y, clearRGBA);
          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      targetCtx.putImageData(imgData, 0, 0);
    }

    function getPixelRGBA(data, x, y) {
      const i = (y * GRID_SIZE + x) * 4;
      return [data[i], data[i + 1], data[i + 2], data[i + 3]];
    }

    function setPixelRGBA(data, x, y, rgba) {
      const i = (y * GRID_SIZE + x) * 4;
      data[i] = rgba[0]; data[i + 1] = rgba[1]; data[i + 2] = rgba[2]; data[i + 3] = rgba[3];
    }

    function colorsMatch(c1, c2) {
      return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2] && c1[3] === c2[3];
    }

    function hexToRgba(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
    }

    function pickColor(x, y) {
      const p = ctx.getImageData(x, y, 1, 1).data;
      if (p[3] === 0) return;
      const hex = '#' + [p[0], p[1], p[2]].map(x => x.toString(16).padStart(2, '0')).join('');
      setColor(hex);
    }

    function setTool(tool) {
      const isShapeTool = ['rect', 'circle', 'line', 'triangle'].includes(tool);
      currentTool = tool;

      document.querySelectorAll('.tool-btn, #btnEyedropper, .shape-popup-btn').forEach(btn => {
        btn.classList.remove('active', 'mode-alt');
      });

      const toolMap = {
        pencil: 'toolPencil', eraser: 'toolEraser', bucket: 'toolBucket',
        eyedropper: 'btnEyedropper', move: 'toolMove', flip: 'toolFlip', rotate: 'toolRotate'
      };

      if (toolMap[tool]) {
        const btn = document.getElementById(toolMap[tool]);
        if (btn) btn.classList.add('active');
      } else if (isShapeTool) {
        document.getElementById('toolShapes').classList.add('active');
        const shapeBtn = document.querySelector(`.shape-popup-btn[data-shape="${tool}"]`);
        if (shapeBtn) shapeBtn.classList.add('active');
      }
    }

    function toggleFillShape() {
      fillShape = !fillShape;
      const btnFill = document.getElementById('btnFillToggle');
      btnFill.classList.toggle('active', fillShape);
      document.getElementById('labelFill').innerText = fillShape ? "Miolo: SIM" : "Miolo: NÃO";
    }

    function setColor(color) {
      currentColor = color;
      addRecentColor(color);
      document.querySelectorAll('.color-swatch').forEach(s => {
        s.classList.toggle('active', s.dataset.color.toLowerCase() === color.toLowerCase());
      });
    }

    function exportPNG() {
      const scaleFactor = Math.max(1, Math.floor(1024 / GRID_SIZE));
      const exportSize = GRID_SIZE * scaleFactor;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = exportSize;
      exportCanvas.height = exportSize;

      const eCtx = exportCanvas.getContext('2d');
      eCtx.imageSmoothingEnabled = false;

      layers.forEach(layer => {
        if (layer.visible) {
          eCtx.drawImage(layer.canvas, 0, 0, exportSize, exportSize);
        }
      });

      const dataUrl = exportCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `pixel-art-${GRID_SIZE}x${GRID_SIZE}.png`;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function setupUI() {
      container.addEventListener('pointerdown', handlePointerDown);
      container.addEventListener('pointermove', handlePointerMove);
      window.addEventListener('pointerup', handlePointerUp);

      const resSelect = document.getElementById('resSelect');
      const customResInput = document.getElementById('customResInput');

      resSelect.onchange = (e) => {
        if (e.target.value === 'custom') {
          customResInput.focus();
        } else {
          customResInput.value = e.target.value;
          updateCanvasResolution(e.target.value);
        }
      };

      customResInput.onchange = (e) => {
        let val = parseInt(e.target.value);
        if (isNaN(val) || val < 4) val = 4;
        if (val > 512) val = 512;
        e.target.value = val;
        resSelect.value = 'custom';
        updateCanvasResolution(val);
      };

      const brushSlider = document.getElementById('brushSlider');
      const brushLabel = document.getElementById('brushSizeLabel');
      brushSlider.oninput = (e) => {
        brushSize = parseInt(e.target.value);
        brushLabel.innerText = `Tam: ${brushSize}px`;
      };

      const fileHeader = document.getElementById('fileInputHeader');
      fileHeader.onchange = (e) => {
        loadFileIntoActiveLayer(e.target.files[0]);
        e.target.value = '';
      };

      document.getElementById('toolPencil').onclick = () => setTool('pencil');
      document.getElementById('toolEraser').onclick = () => setTool('eraser');
      document.getElementById('toolBucket').onclick = () => setTool('bucket');
      document.getElementById('btnEyedropper').onclick = () => setTool('eyedropper');
      document.getElementById('toolMove').onclick = () => setTool('move');
      
      document.getElementById('toolFlip').onclick = () => flipLayerHorizontal(activeLayerIndex);
      document.getElementById('toolRotate').onclick = () => rotateLayer(activeLayerIndex);

      const toolShapes = document.getElementById('toolShapes');
      const shapesExtension = document.getElementById('shapesExtension');

      toolShapes.onclick = () => {
        shapesExtension.classList.toggle('show');
      };

      toolShapes.ondblclick = () => toggleFillShape();

      document.querySelectorAll('.shape-popup-btn').forEach(btn => {
        const shapeType = btn.dataset.shape;
        btn.onclick = () => setTool(shapeType);
        btn.ondblclick = () => {
          toggleFillShape();
          setTool(shapeType);
        };
      });

      const btnGradient = document.getElementById('btnGradientToggle');
      btnGradient.onclick = () => {
        if (gradientMode === 'off') gradientMode = 'linear';
        else if (gradientMode === 'linear') gradientMode = 'border';
        else gradientMode = 'off';

        btnGradient.classList.toggle('active', gradientMode !== 'off');
        const labels = { off: "Degradê: OFF", linear: "Degradê: Linear", border: "Degradê: Bordas" };
        document.getElementById('labelGradient').innerText = labels[gradientMode];
      };

      const btnFill = document.getElementById('btnFillToggle');
      btnFill.onclick = toggleFillShape;

      const gridBtn = document.getElementById('btnGrid');
      gridBtn.onclick = () => {
        showGrid = !showGrid;
        gridBtn.classList.toggle('active', showGrid);
        drawGrid();
      };

      document.getElementById('btnUndo').onclick = undo;
      document.getElementById('btnRedo').onclick = redo;
      document.getElementById('btnExport').onclick = exportPNG;
    }

    /* COLOR PICKER MODAL */
    function setupModalColorPicker() {
      const modal = document.getElementById('colorModal');
      const openBtn = document.getElementById('openColorModalBtn');
      const selectBtn = document.getElementById('btnSelectColor');
      
      const satValCanvas = document.getElementById('satValCanvas');
      const satValCtx = satValCanvas.getContext('2d');
      const satValBox = document.getElementById('satValBox');
      const satValHandle = document.getElementById('satValHandle');

      const hueCanvas = document.getElementById('hueCanvas');
      const hueCtx = hueCanvas.getContext('2d');
      const hueBar = document.getElementById('hueBar');
      const hueHandle = document.getElementById('hueHandle');

      const hexInput = document.getElementById('hexInput');

      openBtn.onclick = () => {
        const rgb = hexToRgba(currentColor);
        const hsv = rgbToHsv(rgb[0], rgb[1], rgb[2]);
        pickerHue = hsv.h; pickerSat = hsv.s; pickerVal = hsv.v;
        modal.style.display = 'flex';
        updateModalPickerUI();
      };

      modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

      selectBtn.onclick = () => {
        const rgb = hsvToRgb(pickerHue, pickerSat, pickerVal);
        setColor(rgbToHex(rgb.r, rgb.g, rgb.b));
        modal.style.display = 'none';
      };

      function drawSatVal() {
        const w = satValCanvas.width, h = satValCanvas.height;
        satValCtx.clearRect(0, 0, w, h);
        satValCtx.fillStyle = `hsl(${pickerHue}, 100%, 50%)`;
        satValCtx.fillRect(0, 0, w, h);

        let gW = satValCtx.createLinearGradient(0, 0, w, 0);
        gW.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gW.addColorStop(1, 'rgba(255, 255, 255, 0)');
        satValCtx.fillStyle = gW;
        satValCtx.fillRect(0, 0, w, h);

        let gB = satValCtx.createLinearGradient(0, 0, 0, h);
        gB.addColorStop(0, 'rgba(0, 0, 0, 0)');
        gB.addColorStop(1, 'rgba(0, 0, 0, 1)');
        satValCtx.fillStyle = gB;
        satValCtx.fillRect(0, 0, w, h);
      }

      function drawHue() {
        const w = hueCanvas.width, h = hueCanvas.height;
        hueCtx.clearRect(0, 0, w, h);
        let grad = hueCtx.createLinearGradient(0, 0, w, 0);
        grad.addColorStop(0, '#ff0000'); grad.addColorStop(1/6, '#ffff00');
        grad.addColorStop(2/6, '#00ff00'); grad.addColorStop(3/6, '#00ffff');
        grad.addColorStop(4/6, '#0000ff'); grad.addColorStop(5/6, '#ff00ff');
        grad.addColorStop(1, '#ff0000');
        hueCtx.fillStyle = grad;
        hueCtx.fillRect(0, 0, w, h);
      }

      function updateModalPickerUI() {
        drawSatVal(); drawHue();
        const rectSV = satValBox.getBoundingClientRect();
        satValHandle.style.left = `${(pickerSat / 100) * rectSV.width}px`;
        satValHandle.style.top = `${(1 - pickerVal / 100) * rectSV.height}px`;

        const rectHue = hueBar.getBoundingClientRect();
        hueHandle.style.left = `${(pickerHue / 360) * rectHue.width}px`;

        const rgb = hsvToRgb(picfkerHue, pickerSat, pickerVal);
        hexInput.value = rgbToHex(rgb.r, rgb.g, rgb.b).toUpperCase();
      }

      let isDraggingSV = false;
      satValBox.addEventListener('pointerdown', (e) => {
        isDraggingSV = true;
        satValBox.setPointerCapture(e.pointerId);
        handleSV(e);
      });
      satValBox.addEventListener('pointermove', (e) => { if (isDraggingSV) handleSV(e); });
      satValBox.addEventListener('pointerup', () => isDraggingSV = false);

      function handleSV(e) {
        const rect = satValBox.getBoundingClientRect();
        let x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        let y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
        pickerSat = (x / rect.width) * 100;
        pickerVal = (1 - y / rect.height) * 100;
        updateModalPickerUI();
      }

      let isDraggingHue = false;
      hueBar.addEventListener('pointerdown', (e) => {
        isDraggingHue = true;
        hueBar.setPointerCapture(e.pointerId);
        handleHue(e);
      });
      hueBar.addEventListener('pointermove', (e) => { if (isDraggingHue) handleHue(e); });
      hueBar.addEventListener('pointerup', () => isDraggingHue = false);

      function handleHue(e) {
        const rect = hueBar.getBoundingClientRect();
        let x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        pickerHue = (x / rect.width) * 360;
        if (pickerHue >= 360) pickerHue = 359.9;
        updateModalPickerUI();
      }
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max, d = max - min;
      s = max === 0 ? 0 : d / max;
      if (max === min) h = 0;
      else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return { h: h * 360, s: s * 100, v: v * 100 };
    }

    function hsvToRgb(h, s, v) {
      s /= 100; v /= 100;
      let c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
      let r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    window.onload = init;
  </script>
