name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Create Android Platform
        run: |
          npx cap add android

      - name: Inject Custom Kotlin Files
        run: |
          mkdir -p android/app/src/main/java/com/chess/app

          # Cria o MainActivity.kt
          cat << 'EOF' > android/app/src/main/java/com/chess/app/MainActivity.kt
          package com.chess.app

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  bridge.webView.addJavascriptInterface(WebAppInterface(this), "AndroidBridge")
              }

              class WebAppInterface(private val activity: MainActivity) {
                  @JavascriptInterface
                  fun requestOverlayPermission() {
                      if (!Settings.canDrawOverlays(activity)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:${activity.packageName}")
                          )
                          activity.startActivity(intent)
                      }
                  }

                  @JavascriptInterface
                  fun startService() {
                      if (Settings.canDrawOverlays(activity)) {
                          val intent = Intent(activity, FloatingService::class.java)
                          activity.startService(intent)
                          activity.finishAffinity()
                      }
                  }
              }
          }
          EOF

          # Cria o FloatingService.kt
          cat << 'EOF' > android/app/src/main/java/com/chess/app/FloatingService.kt
          package com.chess.app

          import android.app.Service
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.Toast

          class FloatingService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var floatingButton: Button

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  floatingButton = Button(this).apply {
                      text = "♟️"
                      setBackgroundColor(0xFF6200EE.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          Toast.makeText(this@FloatingService, "Chess Floating Acionado!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100
                      y = 200
                  }

                  floatingButton.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0
                      var initialY = 0
                      var initialTouchX = 0f
                      var initialTouchY = 0f

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - initialTouchX).toInt()
                                  params.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager.updateViewLayout(floatingButton, params)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  windowManager.addView(floatingButton, params)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::floatingButton.isInitialized) {
                      windowManager.removeView(floatingButton)
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
